name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Every job only reads the repository; nothing publishes, comments or tags.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # treepydoc is answer-for-answer identical to a *version* of numpydoc, so
  # every differential job compares against this exact release. Bumping it is a
  # deliberate act that can change conformance results -- see PLAN.md section 0.
  NUMPYDOC_VERSION: 1.10.0

jobs:
  grammar:
    name: grammar (generate + corpus)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: npm install

      # The generated parser is committed, so it has to match the grammar it
      # came from. The CLI is pinned exactly because a different version can
      # emit a different parse table for the same grammar.
      - name: src/ is up to date with grammar.js
        run: |
          npx tree-sitter generate
          git diff --exit-code -- src/ \
            || { echo "::error::src/ is stale; run 'npx tree-sitter generate' and commit"; exit 1; }

      - name: corpus tests
        run: npx tree-sitter test

      # The scanner has to compile under wasi-sdk too, not just the host
      # toolchain -- that is what the browser playground and any web-tree-sitter
      # consumer load. The CLI downloads the SDK on first use.
      - name: the scanner builds to Wasm
        run: npx tree-sitter build --wasm

      # Proves the playground is servable from a clean checkout, and that the
      # seeding patch still finds its insertion point -- tools/playground.py
      # exits non-zero if a CLI upgrade reshapes the page it edits.
      - name: playground exports
        run: |
          python3 tools/playground.py --export playground
          test -s playground/index.html
          test -s playground/tree-sitter-parser.wasm
          grep -q 'treepydoc.seed' playground/index.html

  build:
    name: build (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # The extension is abi3, so it only needs proving against the oldest
        # supported Python and the newest.
        python: ["3.10", "3.13"]
        exclude:
          # setup-python has no 3.10 build for macOS arm64, which is what
          # macos-latest is; the x86_64 runner still has one.
          - os: macos-latest
            python: "3.10"
        include:
          - os: macos-13
            python: "3.10"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[test]'

      # Run from elsewhere so the repo directory does not shadow the installed
      # package. Without numpydoc the differential tests skip themselves; what
      # this job proves is that the extension builds and imports everywhere.
      - name: unit tests (no numpydoc)
        working-directory: ${{ runner.temp }}
        shell: bash
        run: python -m pytest "$GITHUB_WORKSPACE/tests" -q

      - name: smoke test the installed package
        working-directory: ${{ runner.temp }}
        shell: bash
        run: python "$GITHUB_WORKSPACE/tools/smoke_test.py"

  conformance:
    name: conformance vs numpydoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[test,sphinx]' "numpydoc==${NUMPYDOC_VERSION}"

      - name: unit tests, including the differential cases
        working-directory: ${{ runner.temp }}
        run: python -m pytest "$GITHUB_WORKSPACE/tests" -q

      - name: curated corpus, key by key
        working-directory: ${{ runner.temp }}
        run: python "$GITHUB_WORKSPACE/tools/conformance.py"

      # The most demanding check: numpydoc's own suite, on this parser. The bar
      # is "the same tests pass and the same tests fail", because that checkout
      # has pre-existing failures under a modern Python and a newer Sphinx.
      - name: numpydoc's own test suite
        run: python tools/run_numpydoc_suite.py

      # The editor queries are only exercised if something runs them.
      - name: editor queries capture what editors/README.md claims
        run: python tools/highlight_demo.py

      - name: end-to-end Sphinx build, both parsers
        working-directory: ${{ runner.temp }}
        run: python "$GITHUB_WORKSPACE/tools/sphinx_compare.py"

  differential:
    name: real-world sweep + fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - run: python -m pip install --upgrade pip
      - run: python -m pip install . numpy scipy pandas "numpydoc==${NUMPYDOC_VERSION}"

      - name: every public docstring in numpy, scipy and pandas
        working-directory: ${{ runner.temp }}
        run: python "$GITHUB_WORKSPACE/tools/sweep.py"

      - name: mutation fuzz
        working-directory: ${{ runner.temp }}
        run: python "$GITHUB_WORKSPACE/tools/fuzz.py" --seeds 300 --mutants 10

  lint:
    name: lint (python + C)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - run: python -m pip install --upgrade pip
      # Versions are pinned in pyproject.toml so a new linter release cannot
      # turn CI red on an unchanged tree.
      - run: python -m pip install --group lint

      - run: ruff check .

      - name: types
        run: mypy
      # No `ruff format` check on purpose: `tools/corpus.py` holds docstring
      # fixtures copied verbatim out of numpydoc's test suite, and reformatting
      # is not worth the risk of perturbing the data under test.

      - name: spelling
        run: codespell

      - run: shellcheck run_conformance.sh

      - name: install clang tooling
        run: sudo apt-get update && sudo apt-get install -y clang-format clang-tidy

      # Only the hand-written scanner; src/parser.c is generated, and is
      # excluded via .clang-format-ignore.
      - name: scanner formatting
        run: clang-format --dry-run --Werror src/scanner.c

      - name: scanner static analysis
        run: clang-tidy --warnings-as-errors='*' src/scanner.c -- -std=c11 -Isrc

      - name: scanner warnings
        run: gcc -c -std=c11 -Wall -Wextra -Werror -Isrc -o /dev/null src/scanner.c

  workflows:
    name: lint (workflows)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - run: python -m pip install --upgrade pip
      - run: python -m pip install --group lint

      # Fetched rather than run as an action, so the download is checksummed
      # instead of trusted.
      - name: install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.7
          ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
        run: |
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o actionlint.tar.gz "$url"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum --check --strict
          tar xzf actionlint.tar.gz actionlint

      # actionlint shells out to shellcheck for `run:` blocks, which is how the
      # unquoted `pip install .[test]` glob was caught.
      - name: actionlint
        run: ./actionlint -color

      # Supply-chain and permissions audit of the workflows themselves.
      - name: zizmor
        run: zizmor --persona=pedantic .github/workflows/

  package:
    name: sdist + abi3 wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - run: python -m pip install build
      - run: python -m build --sdist --wheel --outdir dist .

      - name: the wheel installs and works from a clean interpreter
        working-directory: ${{ runner.temp }}
        run: |
          python -m pip install "$GITHUB_WORKSPACE"/dist/*.whl
          python "$GITHUB_WORKSPACE/tools/smoke_test.py"

      - name: and so does the sdist
        working-directory: ${{ runner.temp }}
        run: |
          python -m pip install --force-reinstall --no-binary :all: \
            "$GITHUB_WORKSPACE"/dist/*.tar.gz
          python "$GITHUB_WORKSPACE/tools/smoke_test.py"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
