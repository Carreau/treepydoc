[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "treepydoc"
version = "0.1.0"
description = "A tree-sitter grammar and parser for numpydoc docstrings"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["tree_sitter>=0.23"]

[project.optional-dependencies]
test = ["numpydoc"]
